{% extends 'auth_layout.html' %}
{% block title %}Register{% endblock %}
{% block form_content %}
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Full name<input name="full_name" required minlength="2" value="{{ request.form.get('full_name','') }}" placeholder="Your full name"></label>
<div class="form-row"><label>Email address<input type="email" name="email" required value="{{ request.form.get('email','') }}" placeholder="you@example.com"></label><label>Phone number<input name="phone" required value="{{ request.form.get('phone','') }}" placeholder="Contact number"></label></div>
<div class="form-row"><label>City<input name="city" required value="{{ request.form.get('city','') }}" placeholder="Your city"></label><label>Blood group<select name="blood_group" required><option value="">Select group</option>{% for group in blood_groups %}<option value="{{ group }}" {% if request.form.get('blood_group')==group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label></div>
<label>Account type<select name="role" required><option value="Both">Donor and recipient</option><option value="Donor">Donor</option><option value="Recipient">Recipient</option></select></label>
<div class="form-row"><label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="8" placeholder="Repeat password"></label></div>
<label class="check-line"><input type="checkbox" required> I agree to share my contact details with people responding to my request, where applicable.</label>
<button class="btn btn-primary btn-wide" type="submit">Create my account →</button><p class="form-foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></form>
{% endblock %}
